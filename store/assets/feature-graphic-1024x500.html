<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 1024px; height: 500px; overflow: hidden;
    background: #0A1630;
    font-family: "Segoe UI", system-ui, Arial, sans-serif;
    color: #FFFFFF;
  }
  .wrap { position: relative; width: 1024px; height: 500px; }
  .glow {
    position: absolute; width: 620px; height: 620px; left: -180px; top: -220px;
    background: radial-gradient(circle, rgba(34,211,238,0.22) 0%, rgba(34,211,238,0) 62%);
  }
  .rule {
    position: absolute; left: 0; bottom: 0; width: 1024px; height: 6px;
    background: linear-gradient(90deg, #22D3EE 0%, #3BE38A 62%, #C8F230 100%);
  }
  .mark { position: absolute; left: 84px; top: 158px; width: 184px; height: 184px; }
  .text { position: absolute; left: 312px; top: 168px; }
  .brand { font-size: 58px; font-weight: 800; letter-spacing: 1.5px; line-height: 1; }
  .brand span { color: #3BE38A; font-weight: 900; margin-left: 12px; font-size: 30px; letter-spacing: 3px; vertical-align: top; position: relative; top: 6px; }
  .tag { margin-top: 18px; font-size: 26px; font-weight: 500; color: #C9D6EA; letter-spacing: 0.2px; }
  .meta { margin-top: 26px; font-size: 18px; color: #22D3EE; letter-spacing: 2.4px; font-weight: 700; }
  .ring {
    position: absolute; right: -90px; bottom: -140px; width: 420px; height: 420px;
    border: 2px solid rgba(34,211,238,0.18); border-radius: 50%;
  }
  .ring.two { right: -30px; bottom: -210px; width: 560px; height: 560px; border-color: rgba(59,227,138,0.10); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <div class="ring two"></div>
    <div class="ring"></div>
    <img class="mark" src="../../assets/brand/l1-symbol.png" alt="">
    <div class="text">
      <div class="brand">CLUBSTRIDE<span>PRO</span></div>
      <div class="tag">Squad, sessions and attendance — match-day ready.</div>
      <div class="meta">WORKS OFFLINE</div>
    </div>
    <div class="rule"></div>
  </div>
</body>
</html>
